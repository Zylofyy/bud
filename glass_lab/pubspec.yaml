name: glass_lab
description: "The Liquid Glass Morph Lab: three iOS 26 glass morphs, rebuilt as live shaders."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/glass.frag

  assets:
    - fonts/OFL-Inter.txt
    - fonts/OFL-JetBrainsMono.txt
    - fonts/OFL-SchibstedGrotesk.txt
    - fonts/OFL-Noto.txt

  fonts:
    # Screen text in the recreated recordings.
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: Schibsted Grotesk
      fonts:
        - asset: fonts/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
    # Subsets holding only the symbols the fonts above lack: ✕ ✓, ⋯ and ⅒.
    - family: Lab Symbols
      fonts:
        - asset: fonts/NotoSansSymbols2-Subset.ttf
    - family: Lab Math
      fonts:
        - asset: fonts/NotoSansMath-Subset.ttf
    - family: Lab Fractions
      fonts:
        - asset: fonts/NotoSans-Subset.ttf
